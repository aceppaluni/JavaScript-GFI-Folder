        <!-- Example (hidden in submission) -->
        ## 👾 Description of the Issue — Example (JavaScript)

        The file:

        ```
        src/token/TokenAssociateTransaction.js
        ```

        contains the implementation of the `TokenAssociateTransaction` class.

        The static method `_fromProtobuf()` currently performs multiple responsibilities inline:
        - Extracting the `tokenAssociate` transaction body from the protobuf
        - Converting protobuf token IDs into SDK `TokenId` objects
        - Converting the protobuf account into an SDK `AccountId`

        While the behavior is correct, the inline structure makes the method harder to read
        and more difficult for new contributors to understand, especially those unfamiliar
        with protobuf-based data structures.

        The issue is limited to improving readability and structure only.

