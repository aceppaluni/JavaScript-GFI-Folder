name: Good First Issue Template
description: Create a Good First Issue for new contributors
title: "[Good First Issue]: "
labels: ["Good First Issue"]
assignees: []

body:
  - type: textarea
    id: intro
    attributes:
      label: 🆕🐥 First Timers Only
      description: Who is this issue for?
      value: |
        This issue is reserved for people who have never contributed or have made
        minimal contributions to the **Hiero JavaScript SDK**.

        We recognize that opening a pull request (PR) can be a major barrier for
        new contributors. The goal of this issue—and all other issues labeled
        **Good First Issue**—is to help you make your first contribution in a
        safe, well-guided way.

        No prior knowledge of Hiero, Hedera, or distributed ledger technology is
        required. Basic familiarity with JavaScript and Git is sufficient.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ## 🎯 Purpose of This Issue

        This is an **official Good First Issue** intended for new contributors.

        A Good First Issue must:
        - Have a **narrow and clearly defined scope**
        - Be **fully specified** (no design decisions required)
        - Avoid changes to SDK behavior, APIs, or protocol logic
        - Be solvable with basic JavaScript knowledge

        > If solving the issue requires deciding *what* to do or *how* something
        > should behave, it is **not suitable** as a Good First Issue.

  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        > ### 📋 Good First Issue (GFI) Guidelines
        >
        > **Acceptable GFI work includes:**
        >
        > - Small, explicitly defined refactors with **no behavior changes**
        > - Documentation or JSDoc improvements
        > - Readability improvements (naming, structure)
        > - Mechanical changes fully described in this issue
        >
        > **Not acceptable as GFIs:**
        >
        > - Changes to SDK behavior, APIs, or contracts
        > - Protocol or DLT logic (`_makeTransactionData`, protobuf conversions, etc.)
        > - Work spanning multiple subsystems
        > - Tasks requiring architectural or domain knowledge
        >
        > 📖 Full guidelines:
        > docs/maintainers/good_first_issue_candidate_guidelines.md

  - type: textarea
    id: issue
    attributes:
      label: 👾 Description of the Issue
      description: |
        Describe the issue in a way that is understandable to a new contributor.
        Do not assume prior knowledge of the codebase or Hedera.
        Include links to relevant files where helpful.
      value: |
        The file:

        ```
        src/token/TokenAssociateTransaction.js
        ```

        implements the `TokenAssociateTransaction` class, which is responsible
        for associating one or more tokens with an account.

        While the implementation is correct, parts of the file are difficult for
        new contributors to understand due to limited documentation and dense
        inline logic.

        Improving readability and documentation would make this file more
        approachable without changing any behavior.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 💡 Proposed Solution
      description: |
        Describe the solution at a high level.
        Focus on *what* should be done, not *why* or alternative approaches.
      value: |
        Improve the readability of `TokenAssociateTransaction.js` by enhancing
        existing JSDoc comments and adding clarification where helpful.

        No logic, behavior, or API changes should be made.
    validations:
      required: true

  - type: textarea
    id: implementation
    attributes:
      label: 👩‍💻 Implementation Steps
      description: |
        Describe the technical steps required to implement the solution.
        These steps should be explicit and easy to follow.
      value: |
        To complete this task:

        - [ ] Review existing JSDoc comments in `TokenAssociateTransaction.js`
        - [ ] Improve wording where descriptions are unclear or incomplete
        - [ ] Add missing JSDoc annotations where appropriate
        - [ ] Ensure no runtime behavior or public API changes
        - [ ] Run existing tests to confirm nothing breaks
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: ✅ Acceptance Criteria
      description: Checklist required for merging a pull request
      value: |
        To merge a pull request for this issue:

        - [ ] **Assignment:** Contributor commented `/assign`
        - [ ] **Scope:** Changes are limited to `TokenAssociateTransaction.js`
        - [ ] **Behavior:** No SDK behavior or API changes
        - [ ] **Changelog:** Correct changelog entry added  
              docs/sdk_developers/changelog_entry.md
        - [ ] **Signed Commits:** DCO and GPG-signed commits  
              docs/sdk_developers/signing.md
        - [ ] **Tests:** All CI checks pass
        - [ ] **Review:** All review feedback addressed
    validations:
      required: true

  - type: textarea
    id: contribution_steps
    attributes:
      label: 📋 Step-by-Step Contribution Guide
      description: Contribution workflow for new contributors
      value: |
        If this is your first open-source contribution, follow these steps:

        - [ ] Comment `/assign` to request the issue
        - [ ] Fork the repository and create a branch
        - [ ] Make the requested changes
        - [ ] Sign each commit using `-s -S`
        - [ ] Add a changelog entry
        - [ ] Push your branch and open a pull request

        Helpful resources:
        - Contributing Guide: docs/CONTRIBUTING.md
        - Assignment Workflow: docs/sdk_developers/training/workflow/04_assigning_issues.md
        - Signing Guide: docs/sdk_developers/signing.md

        ❗ Pull requests cannot be merged without signed commits and a changelog entry.
    validations:
      required: true

  - type: textarea
    id: information
    attributes:
      label: 🤔 Additional Information
      description: Extra context or resources for contributors
      value: |
        If you need help, feel free to ask questions in the comments.

        You can also join our community on Discord:
        https://discord.gg/hiero

        Maintainers are happy to help first-time contributors succeed!
